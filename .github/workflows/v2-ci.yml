name: AnswerTravel V2 CI

on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: answertravel_v2
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: answertravel_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U answertravel_v2 -d answertravel_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2
    env:
      DATABASE_URL: postgresql://answertravel_v2:test-only-password@127.0.0.1:5432/answertravel_v2_test
      NODE_ENV: test
      TEST_ADMIN_DATABASE_URL: postgresql://answertravel_v2:test-only-password@127.0.0.1:5432/answertravel_v2_test
      TEST_DATABASE_URL: postgresql://answertravel_v2_app_test:test-app-password@127.0.0.1:5432/answertravel_v2_test
      TEST_APP_PASSWORD: test-app-password
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build:alpha
      - run: npm run db:provision-test
      - run: npm run check:integration
