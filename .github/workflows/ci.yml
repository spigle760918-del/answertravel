name: AnswerTravel CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: answertravel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d answertravel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/answertravel
      ANSWERTRAVEL_API_HOST: 127.0.0.1
      ANSWERTRAVEL_API_PORT: 4174
      ANSWERTRAVEL_STORAGE: postgres
      ANSWERTRAVEL_DEMO_AUTH: "true"
      NODE_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:all
      - run: npm run check:migrations
      - run: npm run check:openapi
      - run: npm run check:deployment
      - run: npm test
      - run: npm run migrate
      - run: npm run migrate:json
      - name: PostgreSQL restart persistence test
        run: npm run test:postgres
